<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%" height="100%">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9b51e0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25px); }
      100% { transform: translateX(0); }
    }
    .wave {
      animation: waveMove 5s ease-in-out infinite;
    }
  </style>

  <path d="M 0 30 Q 225 70 450 30 T 900 30 L 900 100 L 0 100 Z" fill="#0d1117" opacity="0.6" class="wave" />
  <path d="M 0 45 Q 225 15 450 45 T 900 45 L 900 100 L 0 100 Z" fill="#080c14" />
  <path d="M 0 45 Q 225 15 450 45 T 900 45" fill="none" stroke="url(#footerGrad)" stroke-width="2" />
  
  <text x="450" y="80" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    ⚡ CRAFTED WITH SYSTEMATIC RIGOR &amp; LOGIC // 2026 SEYYED NIMA ROUNAGHI
  </text>
</svg>
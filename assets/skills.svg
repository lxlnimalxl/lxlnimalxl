<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>

    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b09b" />
      <stop offset="100%" stop-color="#96c93d" />
    </linearGradient>
  </defs>

  <style>
    @keyframes loadBar1 { 0% { width: 0; } 100% { width: 88%; } }
    @keyframes loadBar2 { 0% { width: 0; } 100% { width: 92%; } }
    @keyframes loadBar3 { 0% { width: 0; } 100% { width: 85%; } }
    @keyframes loadBar4 { 0% { width: 0; } 100% { width: 80%; } }

    .card {
      fill: url(#cardBg);
      stroke: #30363d;
      stroke-width: 1.2;
      rx: 12;
    }
    .card:hover {
      stroke: #58a6ff;
    }
    .skill-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #f0f6fc;
    }
    .skill-desc {
      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      fill: #8b949e;
    }
    .tag {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Card 1: Core Systems & High Performance -->
  <g transform="translate(10, 10)">
    <rect width="280" height="295" class="card" />
    <circle cx="35" cy="40" r="16" fill="#1f293d" />
    <text x="35" y="46" font-size="16" text-anchor="middle">⚙️</text>
    <text x="65" y="44" class="skill-title">Systems &amp; OOP</text>
    <text x="25" y="80" class="skill-desc">High-performance architectures, low-level</text>
    <text x="25" y="98" class="skill-desc">memory control, and robust OOP patterns.</text>
    
    <line x1="25" y1="120" x2="255" y2="120" stroke="#21262d" stroke-width="1" />

    <!-- Badges inside card -->
    <g transform="translate(25, 140)">
      <rect x="0" y="0" width="65" height="26" rx="4" fill="#1f242c" stroke="#388bfd" stroke-width="0.8" />
      <text x="32" y="17" fill="#58a6ff" class="tag" text-anchor="middle">C++20</text>

      <rect x="75" y="0" width="75" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="112" y="17" fill="#c9d1d9" class="tag" text-anchor="middle">OOP / SOLID</text>

      <rect x="160" y="0" width="65" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="192" y="17" fill="#c9d1d9" class="tag" text-anchor="middle">Python</text>

      <rect x="0" y="38" width="115" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="57" y="55" fill="#c9d1d9" class="tag" text-anchor="middle">Data Structures</text>

      <rect x="125" y="38" width="100" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="175" y="55" fill="#c9d1d9" class="tag" text-anchor="middle">Linear Algebra</text>
    </g>

    <!-- Project highlight snippet -->
    <g transform="translate(25, 230)">
      <rect width="230" height="45" rx="6" fill="#0d1117" stroke="#238636" stroke-width="0.8" />
      <text x="12" y="20" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">★ Pet Shop &amp; Hotel Systems</text>
      <text x="12" y="36" fill="#8b949e" font-family="sans-serif" font-size="10">Console-based persistent enterprise engines</text>
    </g>
  </g>

  <!-- Card 2: Modern Web Engineering -->
  <g transform="translate(310, 10)">
    <rect width="280" height="295" class="card" />
    <circle cx="35" cy="40" r="16" fill="#1f293d" />
    <text x="35" y="46" font-size="16" text-anchor="middle">🌐</text>
    <text x="65" y="44" class="skill-title">Web &amp; Full-Stack</text>
    <text x="25" y="80" class="skill-desc">Modern interactive web apps, reactive UIs,</text>
    <text x="25" y="98" class="skill-desc">and resilient backend REST services.</text>
    
    <line x1="25" y1="120" x2="255" y2="120" stroke="#21262d" stroke-width="1" />

    <!-- Badges inside card -->
    <g transform="translate(25, 140)">
      <rect x="0" y="0" width="85" height="26" rx="4" fill="#1f242c" stroke="#f0883e" stroke-width="0.8" />
      <text x="42" y="17" fill="#f0883e" class="tag" text-anchor="middle">JavaScript ES6+</text>

      <rect x="95" y="0" width="60" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="125" y="17" fill="#c9d1d9" class="tag" text-anchor="middle">React</text>

      <rect x="165" y="0" width="65" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="197" y="17" fill="#c9d1d9" class="tag" text-anchor="middle">Node.js</text>

      <rect x="0" y="38" width="65" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="32" y="55" fill="#c9d1d9" class="tag" text-anchor="middle">Express</text>

      <rect x="75" y="38" width="80" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="115" y="55" fill="#c9d1d9" class="tag" text-anchor="middle">TailwindCSS</text>

      <rect x="165" y="38" width="65" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="197" y="55" fill="#c9d1d9" class="tag" text-anchor="middle">REST APIs</text>
    </g>

    <!-- Project highlight snippet -->
    <g transform="translate(25, 230)">
      <rect width="230" height="45" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="0.8" />
      <text x="12" y="20" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">★ 100+ Mini Web Projects</text>
      <text x="12" y="36" fill="#8b949e" font-family="sans-serif" font-size="10">Vanilla JS utilities, animations &amp; DOM tools</text>
    </g>
  </g>

  <!-- Card 3: Architecture & Infrastructure -->
  <g transform="translate(610, 10)">
    <rect width="280" height="295" class="card" />
    <circle cx="35" cy="40" r="16" fill="#1f293d" />
    <text x="35" y="46" font-size="16" text-anchor="middle">🛡️</text>
    <text x="65" y="44" class="skill-title">DevOps &amp; Tools</text>
    <text x="25" y="80" class="skill-desc">Reliable development environments, databases,</text>
    <text x="25" y="98" class="skill-desc">version control, and UI design precision.</text>
    
    <line x1="25" y1="120" x2="255" y2="120" stroke="#21262d" stroke-width="1" />

    <!-- Badges inside card -->
    <g transform="translate(25, 140)">
      <rect x="0" y="0" width="55" height="26" rx="4" fill="#1f242c" stroke="#d2a8ff" stroke-width="0.8" />
      <text x="27" y="17" fill="#d2a8ff" class="tag" text-anchor="middle">Linux</text>

      <rect x="65" y="0" width="60" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="95" y="17" fill="#c9d1d9" class="tag" text-anchor="middle">Docker</text>

      <rect x="135" y="0" width="50" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="160" y="17" fill="#c9d1d9" class="tag" text-anchor="middle">Git</text>

      <rect x="195" y="0" width="35" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="212" y="17" fill="#c9d1d9" class="tag" text-anchor="middle">CI</text>

      <rect x="0" y="38" width="60" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="30" y="55" fill="#c9d1d9" class="tag" text-anchor="middle">MySQL</text>

      <rect x="70" y="38" width="55" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="97" y="55" fill="#c9d1d9" class="tag" text-anchor="middle">Figma</text>

      <rect x="135" y="38" width="95" height="26" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="0.8" />
      <text x="182" y="55" fill="#c9d1d9" class="tag" text-anchor="middle">E-Commerce</text>
    </g>

    <!-- Project highlight snippet -->
    <g transform="translate(25, 230)">
      <rect width="230" height="45" rx="6" fill="#0d1117" stroke="#8957e5" stroke-width="0.8" />
      <text x="12" y="20" fill="#d2a8ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">★ Bus Tracker &amp; Sockets</text>
      <text x="12" y="36" fill="#8b949e" font-family="sans-serif" font-size="10">Real-time IoT driver telemetry client</text>
    </g>
  </g>
</svg>
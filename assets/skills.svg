    @keyframes bentoFloat1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes bentoFloat2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    .b-anim1 { animation: bentoFloat1 4s ease-in-out infinite; }
    .b-anim2 { animation: bentoFloat2 4s ease-in-out infinite 1s; }

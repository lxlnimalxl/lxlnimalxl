<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1930" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="orangeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }
    .tag-rect { rx: 6; ry: 6; fill: #131f38; stroke: #26385d; stroke-width: 1; }
    .tag-label { font-size: 12px; font-weight: 600; fill: #f8fafc; }
  </style>

  <rect width="950" height="420" rx="18" fill="#04060b" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Header -->
  <g transform="translate(35, 34)">
    <text class="font-mono" font-size="13" font-weight="800" fill="#38bdf8" letter-spacing="0.5">TECHNICAL RADAR &amp; ENGINEERING ARCHITECTURE</text>
    <text class="font-mono" font-size="11.5" fill="#64748b" x="660">BENTO MATRIX • 2026 SPECS</text>
    <line x1="0" y1="14" x2="880" y2="14" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- CARD 1: Frontend (Top Left) -->
  <g transform="translate(35, 68)">
    <rect width="425" height="155" rx="14" fill="url(#cardBg)" stroke="url(#cyanBorder)" stroke-width="1.3" />
    <circle cx="26" cy="28" r="4.5" fill="#00f2fe" />
    <text x="40" y="33" class="font-sans card-title" fill="#38bdf8">FRONTEND ARCHITECTURE</text>
    
    <g transform="translate(18, 54)">
      <rect width="95" height="30" class="tag-rect" /><text x="47" y="20" text-anchor="middle" class="font-sans tag-label">React 19 / 18</text>
      <rect x="105" width="105" height="30" class="tag-rect" /><text x="157" y="20" text-anchor="middle" class="font-sans tag-label">TypeScript</text>
      <rect x="220" width="85" height="30" class="tag-rect" /><text x="262" y="20" text-anchor="middle" class="font-sans tag-label">Next.js</text>
      <rect x="315" width="90" height="30" class="tag-rect" /><text x="360" y="20" text-anchor="middle" class="font-sans tag-label">Vanilla JS</text>
    </g>
    <g transform="translate(18, 96)">
      <rect width="125" height="30" class="tag-rect" /><text x="62" y="20" text-anchor="middle" class="font-sans tag-label">Modern CSS3/Grid</text>
      <rect x="135" width="105" height="30" class="tag-rect" /><text x="187" y="20" text-anchor="middle" class="font-sans tag-label">Tailwind CSS</text>
      <rect x="250" width="135" height="30" class="tag-rect" /><text x="317" y="20" text-anchor="middle" class="font-sans tag-label">WebSockets / API</text>
    </g>
  </g>

  <!-- CARD 2: UI/UX (Top Right) -->
  <g transform="translate(490, 68)">
    <rect width="425" height="155" rx="14" fill="url(#cardBg)" stroke="url(#purpleBorder)" stroke-width="1.3" />
    <circle cx="26" cy="28" r="4.5" fill="#c084fc" />
    <text x="40" y="33" class="font-sans card-title" fill="#c084fc">UI/UX &amp; CREATIVE DESIGN</text>
    
    <g transform="translate(18, 54)">
      <rect width="115" height="30" class="tag-rect" /><text x="57" y="20" text-anchor="middle" class="font-sans tag-label">Figma Systems</text>
      <rect x="125" width="135" height="30" class="tag-rect" /><text x="192" y="20" text-anchor="middle" class="font-sans tag-label">Micro-Interactions</text>
      <rect x="270" width="115" height="30" class="tag-rect" /><text x="327" y="20" text-anchor="middle" class="font-sans tag-label">Glassmorphism</text>
    </g>
    <g transform="translate(18, 96)">
      <rect width="115" height="30" class="tag-rect" /><text x="57" y="20" text-anchor="middle" class="font-sans tag-label">Design Tokens</text>
      <rect x="125" width="135" height="30" class="tag-rect" /><text x="192" y="20" text-anchor="middle" class="font-sans tag-label">Adobe Photoshop</text>
      <rect x="270" width="115" height="30" class="tag-rect" /><text x="327" y="20" text-anchor="middle" class="font-sans tag-label">Responsive UX</text>
    </g>
  </g>

  <!-- CARD 3: Systems (Bottom Left) -->
  <g transform="translate(35, 238)">
    <rect width="425" height="155" rx="14" fill="url(#cardBg)" stroke="url(#greenBorder)" stroke-width="1.3" />
    <circle cx="26" cy="28" r="4.5" fill="#34d399" />
    <text x="40" y="33" class="font-sans card-title" fill="#34d399">SYSTEMS &amp; BACKEND LOGIC</text>
    
    <g transform="translate(18, 54)">
      <rect width="115" height="30" class="tag-rect" /><text x="57" y="20" text-anchor="middle" class="font-sans tag-label">C++20 / SOLID</text>
      <rect x="125" width="85" height="30" class="tag-rect" /><text x="167" y="20" text-anchor="middle" class="font-sans tag-label">Python</text>
      <rect x="220" width="85" height="30" class="tag-rect" /><text x="262" y="20" text-anchor="middle" class="font-sans tag-label">Node.js</text>
      <rect x="315" width="90" height="30" class="tag-rect" /><text x="360" y="20" text-anchor="middle" class="font-sans tag-label">Express</text>
    </g>
    <g transform="translate(18, 96)">
      <rect width="110" height="30" class="tag-rect" /><text x="55" y="20" text-anchor="middle" class="font-sans tag-label">REST APIs</text>
      <rect x="120" width="105" height="30" class="tag-rect" /><text x="172" y="20" text-anchor="middle" class="font-sans tag-label">GraphQL</text>
      <rect x="235" width="90" height="30" class="tag-rect" /><text x="280" y="20" text-anchor="middle" class="font-sans tag-label">MySQL/SQL</text>
      <rect x="335" width="70" height="30" class="tag-rect" /><text x="370" y="20" text-anchor="middle" class="font-sans tag-label">JSON</text>
    </g>
  </g>

  <!-- CARD 4: DevOps (Bottom Right) -->
  <g transform="translate(490, 238)">
    <rect width="425" height="155" rx="14" fill="url(#cardBg)" stroke="url(#orangeBorder)" stroke-width="1.3" />
    <circle cx="26" cy="28" r="4.5" fill="#fb923c" />
    <text x="40" y="33" class="font-sans card-title" fill="#fb923c">WORKFLOWS &amp; DEVOPS</text>
    
    <g transform="translate(18, 54)">
      <rect width="105" height="30" class="tag-rect" /><text x="52" y="20" text-anchor="middle" class="font-sans tag-label">Git / GitHub</text>
      <rect x="115" width="145" height="30" class="tag-rect" /><text x="187" y="20" text-anchor="middle" class="font-sans tag-label">GitHub Actions CI</text>
      <rect x="270" width="115" height="30" class="tag-rect" /><text x="327" y="20" text-anchor="middle" class="font-sans tag-label">Docker Engines</text>
    </g>
    <g transform="translate(18, 96)">
      <rect width="115" height="30" class="tag-rect" /><text x="57" y="20" text-anchor="middle" class="font-sans tag-label">Linux Systems</text>
      <rect x="125" width="140" height="30" class="tag-rect" /><text x="195" y="20" text-anchor="middle" class="font-sans tag-label">Performance / SEO</text>
      <rect x="275" width="110" height="30" class="tag-rect" /><text x="330" y="20" text-anchor="middle" class="font-sans tag-label">MCP Protocol</text>
    </g>
  </g>
</svg>
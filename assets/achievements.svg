    <text x="80" y="52" font-size="36" text-anchor="middle">ðŸ¦¹</text>
    <text x="80" y="84" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#c084fc" letter-spacing="0.5">YOLO</text>
    <rect x="25" y="98" width="110" height="24" rx="12" fill="#6b21a8" stroke="#c084fc" stroke-width="0.8" />
    <text x="80" y="114" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#fae8ff">DIRECT MERGE</text>

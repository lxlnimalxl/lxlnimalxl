    <rect width="170" height="140" rx="12" fill="url(#cyanBadge)" stroke="#0284c7" stroke-width="1.2" />
    <text x="85" y="52" font-size="36" text-anchor="middle">ðŸŽ¯</text>
    <text x="85" y="84" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#38bdf8" letter-spacing="0.5">QUICKDRAW</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="50%" stop-color="#191206" />
      <stop offset="100%" stop-color="#0c0903" />
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <rect width="950" height="180" rx="18" fill="#04060b" stroke="#251a08" stroke-width="1.5" />

  <!-- ================= BADGE 1: PULL SHARK GOLD ================= -->
  <g transform="translate(25, 18)">
    <rect width="170" height="144" rx="14" fill="url(#goldPlate)" stroke="url(#goldRim)" stroke-width="1.5" />
    <g transform="translate(85, 48)">
      <animateTransform attributeName="transform" type="translate" values="85,48; 85,42; 85,48" dur="3s" repeatCount="indefinite" />
      <!-- Pure Vector Shark Icon -->
      <path d="M -22 6 C -18 -8 -2 -16 14 -12 C 16 -18 20 -22 26 -22 C 24 -16 22 -10 24 -6 C 28 -2 30 6 22 14 C 14 18 -6 18 -18 12 Z" fill="#fde047" stroke="#ffd700" stroke-width="1.5" />
      <circle cx="16" cy="-4" r="2" fill="#04060b" />
      <path d="M -12 2 L -2 10 L 8 4" stroke="#ca8a04" stroke-width="1.5" fill="none" />
    </g>
    <text x="85" y="92" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#fde047">PULL SHARK</text>
    <rect x="30" y="104" width="110" height="26" rx="13" fill="#713f12" stroke="#eab308" stroke-width="1.2" />
    <text x="85" y="121" text-anchor="middle" class="font-mono" font-size="12" font-weight="800" fill="#fef08a">GOLD x128</text>
  </g>

  <!-- ================= BADGE 2: PAIR EXTRAORDINAIRE GOLD ================= -->
  <g transform="translate(210, 18)">
    <rect width="170" height="144" rx="14" fill="url(#goldPlate)" stroke="url(#goldRim)" stroke-width="1.5" />
    <g transform="translate(85, 48)">
      <animateTransform attributeName="transform" type="translate" values="85,48; 85,42; 85,48" dur="3.2s" repeatCount="indefinite" />
      <!-- Pure Vector Pair Duo Icon -->
      <circle cx="-10" cy="-10" r="7" fill="#fde047" />
      <path d="M -20 12 C -20 2 -16 -2 -10 -2 C -4 -2 0 2 0 12 Z" fill="#fde047" />
      <circle cx="10" cy="-10" r="7" fill="#fef08a" />
      <path d="M 0 12 C 0 2 4 -2 10 -2 C 16 -2 20 2 20 12 Z" fill="#fef08a" />
      <path d="M -10 6 L 10 6" stroke="#ca8a04" stroke-width="2" />
    </g>
    <text x="85" y="92" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#fde047">PAIR EXTRA</text>
    <rect x="30" y="104" width="110" height="26" rx="13" fill="#713f12" stroke="#eab308" stroke-width="1.2" />
    <text x="85" y="121" text-anchor="middle" class="font-mono" font-size="12" font-weight="800" fill="#fef08a">GOLD x48</text>
  </g>

  <!-- ================= BADGE 3: GALAXY BRAIN GOLD ================= -->
  <g transform="translate(395, 18)">
    <rect width="170" height="144" rx="14" fill="url(#goldPlate)" stroke="url(#goldRim)" stroke-width="1.5" />
    <g transform="translate(85, 48)">
      <animateTransform attributeName="transform" type="translate" values="85,48; 85,42; 85,48" dur="3.4s" repeatCount="indefinite" />
      <!-- Pure Vector Brain Neural Network -->
      <path d="M -16 -8 C -22 -14 -12 -22 -2 -18 C 8 -22 18 -14 12 -8 C 20 -2 18 12 10 16 C 2 18 -2 18 -8 16 C -16 12 -20 -2 -16 -8 Z" fill="#fde047" stroke="#ffd700" stroke-width="1.2" />
      <line x1="-8" y1="-8" x2="6" y2="2" stroke="#713f12" stroke-width="1.8" />
      <line x1="-6" y1="6" x2="8" y2="-6" stroke="#713f12" stroke-width="1.8" />
      <circle cx="-8" cy="-8" r="2.5" fill="#ffffff" />
      <circle cx="6" cy="2" r="2.5" fill="#ffffff" />
      <circle cx="-6" cy="6" r="2.5" fill="#ffffff" />
      <circle cx="8" cy="-6" r="2.5" fill="#ffffff" />
    </g>
    <text x="85" y="92" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#fde047">GALAXY BRAIN</text>
    <rect x="30" y="104" width="110" height="26" rx="13" fill="#713f12" stroke="#eab308" stroke-width="1.2" />
    <text x="85" y="121" text-anchor="middle" class="font-mono" font-size="12" font-weight="800" fill="#fef08a">GOLD x32</text>
  </g>

  <!-- ================= BADGE 4: QUICKDRAW ================= -->
  <g transform="translate(580, 18)">
    <rect width="170" height="144" rx="14" fill="#081424" stroke="#0284c7" stroke-width="1.5" />
    <g transform="translate(85, 48)">
      <animateTransform attributeName="transform" type="translate" values="85,48; 85,42; 85,48" dur="3.1s" repeatCount="indefinite" />
      <!-- Pure Vector Target / Lightning Icon -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="0" cy="0" r="11" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#00f2fe" />
      <path d="M 12 -16 L 4 -2 L 10 0 L -2 16 L 2 4 L -4 2 Z" fill="#fde047" stroke="#f59e0b" stroke-width="0.8" />
    </g>
    <text x="85" y="92" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#38bdf8">QUICKDRAW</text>
    <rect x="30" y="104" width="110" height="26" rx="13" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
    <text x="85" y="121" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="700" fill="#e0f2fe">&lt; 3s SPEED</text>
  </g>

  <!-- ================= BADGE 5: YOLO ================= -->
  <g transform="translate(765, 18)">
    <rect width="160" height="144" rx="14" fill="#180b24" stroke="#9333ea" stroke-width="1.5" />
    <g transform="translate(80, 48)">
      <animateTransform attributeName="transform" type="translate" values="80,48; 80,42; 80,48" dur="3.3s" repeatCount="indefinite" />
      <!-- Pure Vector Rocket Deploy Icon -->
      <path d="M 0 -18 C 8 -12 12 0 12 10 L 0 6 L -12 10 C -12 0 -8 -12 0 -18 Z" fill="#c084fc" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="0" cy="-2" r="3.5" fill="#04060b" />
      <path d="M -4 10 L 0 18 L 4 10 Z" fill="#f59e0b" />
    </g>
    <text x="80" y="92" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#c084fc">YOLO</text>
    <rect x="25" y="104" width="110" height="26" rx="13" fill="#6b21a8" stroke="#c084fc" stroke-width="1" />
    <text x="80" y="121" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="700" fill="#fae8ff">DIRECT MERGE</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldPedestal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f0a" />
      <stop offset="50%" stop-color="#191307" />
      <stop offset="100%" stop-color="#0d0a04" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1829" />
      <stop offset="100%" stop-color="#050c14" />
    </linearGradient>

    <linearGradient id="purpleBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0e29" />
      <stop offset="100%" stop-color="#0f0714" />
    </linearGradient>

    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Background Base Frame -->
  <rect width="950" height="180" rx="16" fill="#04060b" stroke="#251a08" stroke-width="1.5" />

  <!-- Badge 1: Pull Shark Gold (x128) -->
  <g transform="translate(25, 20)">
    <rect width="170" height="140" rx="12" fill="url(#goldPedestal)" stroke="url(#goldBorder)" stroke-width="1.5" />
    <text x="85" y="52" font-size="36" text-anchor="middle">ðŸ¦ˆ</text>
    <text x="85" y="84" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#fde047" letter-spacing="0.5">PULL SHARK</text>
    <rect x="30" y="98" width="110" height="24" rx="12" fill="#713f12" stroke="#eab308" stroke-width="1" />
    <text x="85" y="114" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="800" fill="#fef08a">GOLD x128</text>
  </g>

  <!-- Badge 2: Pair Extraordinaire Gold (x48) -->
  <g transform="translate(210, 20)">
    <rect width="170" height="140" rx="12" fill="url(#goldPedestal)" stroke="url(#goldBorder)" stroke-width="1.5" />
    <text x="85" y="52" font-size="36" text-anchor="middle">ðŸ‘¯</text>
    <text x="85" y="84" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#fde047" letter-spacing="0.5">PAIR EXTRA</text>
    <rect x="30" y="98" width="110" height="24" rx="12" fill="#713f12" stroke="#eab308" stroke-width="1" />
    <text x="85" y="114" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="800" fill="#fef08a">GOLD x48</text>
  </g>

  <!-- Badge 3: Galaxy Brain Gold (x32) -->
  <g transform="translate(395, 20)">
    <rect width="170" height="140" rx="12" fill="url(#goldPedestal)" stroke="url(#goldBorder)" stroke-width="1.5" />
    <text x="85" y="52" font-size="36" text-anchor="middle">ðŸ§ </text>
    <text x="85" y="84" text-anchor="middle" class="font-sans" font-size="13" font-weight="900" fill="#fde047" letter-spacing="0.5">GALAXY BRAIN</text>

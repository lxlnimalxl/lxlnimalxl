<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <linearGradient id="deepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030509" />
      <stop offset="40%" stop-color="#060b17" />
      <stop offset="80%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="crystalFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="crystalFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="crystalFacet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="haloCyan" cx="80%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloPurple" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <filter id="specularGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor-blink { animation: cursorBlink 0.9s infinite; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="950" height="320" rx="20" fill="url(#deepSpace)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Hologram Lighting -->
  <rect width="950" height="320" rx="20" fill="url(#haloCyan)" />
  <rect width="950" height="320" rx="20" fill="url(#haloPurple)" />

  <!-- 3D Perspective Grid -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="0.8">
    <line x1="0" y1="230" x2="950" y2="230" />
    <line x1="0" y1="255" x2="950" y2="255" />
    <line x1="0" y1="285" x2="950" y2="285" />
    <line x1="475" y1="160" x2="0" y2="320" />
    <line x1="475" y1="160" x2="200" y2="320" />
    <line x1="475" y1="160" x2="400" y2="320" />
    <line x1="475" y1="160" x2="550" y2="320" />
    <line x1="475" y1="160" x2="750" y2="320" />
    <line x1="475" y1="160" x2="950" y2="320" />
  </g>

  <!-- HUD Corner Markers -->
  <g stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 24 45 L 24 24 L 45 24" />
    <path d="M 926 45 L 926 24 L 905 24" />
    <path d="M 24 275 L 24 296 L 45 296" />
    <path d="M 926 275 L 926 296 L 905 296" />
  </g>

  <!-- Terminal Window Controls -->
  <g transform="translate(50, 40)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="16" cy="0" r="5" fill="#eab308" />
    <circle cx="32" cy="0" r="5" fill="#10b981" />
    <text x="52" y="4" class="font-mono" font-size="12" font-weight="600" fill="#64748b">
      lxlnimalxl@nexus <tspan fill="#00f2fe">~/architect</tspan> <tspan fill="#a855f7">(master)</tspan>
    </text>
  </g>

  <!-- Live Status Capsule -->
  <g transform="translate(685, 26)">
    <rect width="215" height="32" rx="16" fill="#071322" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" filter="url(#specularGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" class="font-mono" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.4">AVAILABLE FOR WORK</text>
  </g>

  <!-- Hero Name Typography -->
  <g transform="translate(50, 130)">
    <text class="font-sans" font-size="46" font-weight="900" fill="url(#neonTitle)" letter-spacing="-0.5" filter="url(#specularGlow)">
      SEYED NIMA ROUNAGHI
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(50, 172)">
    <text class="font-mono" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="0.3">
      <tspan fill="#38bdf8">Frontend Architect</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#c084fc">UI/UX Technologist</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#34d399">Creative Developer</tspan>
    </text>
    <rect x="585" y="-14" width="7" height="18" fill="#00f2fe" class="cursor-blink" />
  </g>

  <!-- 4 Focus Pills -->
  <g transform="translate(50, 225)">
    <g transform="translate(0, 0)">
      <rect width="175" height="38" rx="19" fill="#0b1324" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="87" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#38bdf8">REACT 19 &amp; TYPESCRIPT</text>
    </g>

    <g transform="translate(188, 0)">
      <rect width="185" height="38" rx="19" fill="#140f24" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="92" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#c084fc">DESIGN SYSTEMS &amp; UX</text>
    </g>

    <g transform="translate(385, 0)">
      <rect width="185" height="38" rx="19" fill="#0a1818" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="92" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#34d399">C++20 &amp; OOP ENGINES</text>
    </g>

    <g transform="translate(582, 0)">
      <rect width="210" height="38" rx="19" fill="#1c1404" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.9" />
      <text x="105" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="800" fill="url(#goldGradient)">5x GITHUB GOLD TIERS</text>
    </g>
  </g>

  <!-- 3D HOLOGRAPHIC GYROSCOPE & CRYSTAL -->
  <g transform="translate(770, 160)">
    <!-- Gyro Ring 1 -->
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#00f2fe" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
    </ellipse>

    <!-- Gyro Ring 2 -->
    <ellipse cx="0" cy="0" rx="72" ry="32" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="10 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
    </ellipse>

    <!-- Gyro Ring 3 -->
    <ellipse cx="0" cy="0" rx="45" ry="72" fill="none" stroke="#ec4899" stroke-width="1.4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="8s" repeatCount="indefinite" />
    </ellipse>

    <!-- Floating 3D Crystal Core -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="3.5s" repeatCount="indefinite" />
      
      <!-- Crystal Shadow -->
      <ellipse cx="0" cy="65" rx="30" ry="7" fill="#00f2fe" opacity="0.2">
        <animate attributeName="rx" values="30;20;30" dur="3.5s" repeatCount="indefinite" />
      </ellipse>

      <!-- Facets -->
      <polygon points="0,-45 -35,5 0,22" fill="url(#crystalFacet1)" stroke="#00f2fe" stroke-width="0.8" />
      <polygon points="0,-45 35,5 0,22" fill="url(#crystalFacet2)" stroke="#a855f7" stroke-width="0.8" />
      <polygon points="-35,5 0,22 0,52" fill="url(#crystalFacet2)" stroke="#a855f7" stroke-width="0.8" />
      <polygon points="35,5 0,22 0,52" fill="url(#crystalFacet3)" stroke="#ec4899" stroke-width="0.8" />

      <!-- Glowing Vertices -->
      <circle cx="0" cy="-45" r="3" fill="#ffffff" filter="url(#specularGlow)" />
      <circle cx="-35" cy="5" r="2.5" fill="#00f2fe" filter="url(#specularGlow)" />
      <circle cx="35" cy="5" r="2.5" fill="#ec4899" filter="url(#specularGlow)" />
      <circle cx="0" cy="22" r="3.5" fill="#ffffff" filter="url(#specularGlow)" />
      <circle cx="0" cy="52" r="2.5" fill="#a855f7" filter="url(#specularGlow)" />
    </g>
  </g>
</svg>
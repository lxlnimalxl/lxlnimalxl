<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 330" width="100%" height="100%">
  <defs>
    <!-- Master Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060b" />
      <stop offset="40%" stop-color="#080e1a" />
      <stop offset="80%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="brandTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Ambient Orbs -->
    <radialGradient id="orbCyan" cx="18%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPurple" cx="82%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPink" cx="50%" cy="90%" r="35%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink { animation: cursorBlink 0.9s infinite; }

    @keyframes liveBeacon {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }
    .beacon { transform-origin: center; animation: liveBeacon 2s ease-in-out infinite; }
  </style>

  <!-- Base Card Frame -->
  <rect width="950" height="330" rx="20" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Lighting Layer -->
  <rect width="950" height="330" rx="20" fill="url(#orbCyan)" />
  <rect width="950" height="330" rx="20" fill="url(#orbPurple)" />
  <rect width="950" height="330" rx="20" fill="url(#orbPink)" />

  <!-- High-Tech Coordinate Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="50" x2="950" y2="50" />
    <line x1="0" y1="110" x2="950" y2="110" />
    <line x1="0" y1="170" x2="950" y2="170" />
    <line x1="0" y1="230" x2="950" y2="230" />
    <line x1="0" y1="290" x2="950" y2="290" />
    <line x1="190" y1="0" x2="190" y2="330" />
    <line x1="380" y1="0" x2="380" y2="330" />
    <line x1="570" y1="0" x2="570" y2="330" />
    <line x1="760" y1="0" x2="760" y2="330" />
  </g>

  <!-- Decorative Corner HUD Brackets -->
  <g stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.75">
    <path d="M 24 50 L 24 24 L 50 24" />
    <path d="M 926 50 L 926 24 L 900 24" />
    <path d="M 24 280 L 24 306 L 50 306" />
    <path d="M 926 280 L 926 306 L 900 306" />
  </g>

  <!-- Window Header Bar -->
  <g transform="translate(50, 38)">
    <circle cx="0" cy="0" r="5.5" fill="#ef4444" opacity="0.85" />
    <circle cx="18" cy="0" r="5.5" fill="#eab308" opacity="0.85" />
    <circle cx="36" cy="0" r="5.5" fill="#10b981" opacity="0.85" />
    <text x="60" y="4" class="font-mono" font-size="12" font-weight="600" fill="#64748b">
      lxlnimalxl@production-node <tspan fill="#00f2fe">~/architect</tspan> <tspan fill="#a855f7">(master)</tspan>
    </text>
  </g>

  <!-- Live Status Capsule (Top Right) -->
  <g transform="translate(685, 26)">
    <rect width="215" height="34" rx="17" fill="#091422" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#10b981" class="beacon" />
    <circle cx="20" cy="17" r="4" fill="#10b981" filter="url(#subtle)" />
    <text x="36" y="22" class="font-mono" font-size="11.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">OPEN TO WORK / FREELANCE</text>
  </g>

  <!-- Hero Name Typography -->
  <g transform="translate(50, 132)">
    <text class="font-sans" font-size="48" font-weight="900" fill="url(#brandTitle)" letter-spacing="-0.5" filter="url(#subtle)">
      SEYED NIMA ROUNAGHI
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(50, 178)">
    <text class="font-mono" font-size="17" font-weight="600" fill="#94a3b8" letter-spacing="0.3">
      <tspan fill="#38bdf8">Frontend Architect</tspan>
      <tspan fill="#475569"> â€¢ </tspan>
      <tspan fill="#c084fc">UI/UX Technologist</tspan>
      <tspan fill="#475569"> â€¢ </tspan>
      <tspan fill="#34d399">Creative Systems Engineer</tspan>
    </text>
    <rect x="635" y="-15" width="8" height="20" fill="#00f2fe" class="cursor-blink" />
  </g>

  <!-- Interactive Focus Pills (Bottom Grid) -->
  <g transform="translate(50, 230)">
    <!-- Pill 1: React & Next -->
    <g transform="translate(0, 0)">
      <rect width="185" height="38" rx="19" fill="#0b1324" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="92" y="24" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#38bdf8">âš¡ REACT 19 &amp; TYPESCRIPT</text>
    </g>

    <!-- Pill 2: UI/UX & Design Systems -->
    <g transform="translate(200, 0)">
      <rect width="195" height="38" rx="19" fill="#140f24" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="97" y="24" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#c084fc">ðŸŽ¨ DESIGN SYSTEMS &amp; UX</text>
    </g>

    <!-- Pill 3: C++ & High-Performance -->
    <g transform="translate(410, 0)">
      <rect width="195" height="38" rx="19" fill="#0a1818" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="97" y="24" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#34d399">âš™ï¸ C++20 &amp; HIGH-PERF OOP</text>
    </g>

    <!-- Pill 4: Gold Tiers Unlocked -->
    <g transform="translate(620, 0)">
      <rect width="230" height="38" rx="19" fill="#1c1404" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.9" />
      <text x="115" y="24" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="800" fill="url(#goldText)">ðŸ† GITHUB GOLD TIERS (x128)</text>
    </g>
  </g>
</svg>
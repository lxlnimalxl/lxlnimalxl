<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030509" />
      <stop offset="40%" stop-color="#060b17" />
      <stop offset="80%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- 3D Title Neon Gradient -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- 3D Crystal Shading -->
    <linearGradient id="crystalFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="crystalFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="crystalFacet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="haloCyan" cx="80%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloPurple" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Depth Filters -->
    <filter id="glow3d" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="specularGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* 3D Gyroscope & Floating Crystal Animations */
    @keyframes gyroRotate1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes gyroRotate2 {
      0% { transform: rotate(0deg) scaleY(0.5); }
      100% { transform: rotate(-360deg) scaleY(0.5); }
    }
    @keyframes gyroRotate3 {
      0% { transform: rotate(45deg) scaleX(0.6); }
      100% { transform: rotate(405deg) scaleX(0.6); }
    }
    @keyframes crystalLevitate {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(6deg); }
    }
    @keyframes facetShine1 {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.4; }
    }
    @keyframes facetShine2 {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.95; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes laserSweep {
      0% { transform: translateX(-950px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    @keyframes starPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    .gyro-1 { transform-origin: 780px 175px; animation: gyroRotate1 16s linear infinite; }
    .gyro-2 { transform-origin: 780px 175px; animation: gyroRotate2 12s linear infinite; }
    .gyro-3 { transform-origin: 780px 175px; animation: gyroRotate3 9s linear infinite; }
    .crystal-float { transform-origin: 780px 175px; animation: crystalLevitate 4s ease-in-out infinite; }
    .facet-1 { animation: facetShine1 3s ease-in-out infinite; }
    .facet-2 { animation: facetShine2 3s ease-in-out infinite; }
    .laser { animation: laserSweep 5s ease-in-out infinite; }
    .pill-anim1 { animation: floatPill 3.5s ease-in-out infinite; }
    .pill-anim2 { animation: floatPill 4s ease-in-out infinite 0.5s; }
    .pill-anim3 { animation: floatPill 3.8s ease-in-out infinite 1s; }
    .pill-anim4 { animation: floatPill 4.2s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="950" height="350" rx="20" fill="url(#deepSpace)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Hologram Lighting -->
  <rect width="950" height="350" rx="20" fill="url(#haloCyan)" />
  <rect width="950" height="350" rx="20" fill="url(#haloPurple)" />

  <!-- 3D Perspective Floor Grid -->
  <g opacity="0.12" stroke="#00f2fe" stroke-width="0.8">
    <line x1="0" y1="260" x2="950" y2="260" />
    <line x1="0" y1="280" x2="950" y2="280" />
    <line x1="0" y1="305" x2="950" y2="305" />
    <line x1="0" y1="335" x2="950" y2="335" />
    <!-- Perspective lines receding to vanishing point -->
    <line x1="475" y1="180" x2="0" y2="350" />
    <line x1="475" y1="180" x2="150" y2="350" />
    <line x1="475" y1="180" x2="300" y2="350" />
    <line x1="475" y1="180" x2="475" y2="350" />
    <line x1="475" y1="180" x2="650" y2="350" />
    <line x1="475" y1="180" x2="800" y2="350" />
    <line x1="475" y1="180" x2="950" y2="350" />
  </g>

  <!-- Animated Starfield Particles -->
  <g fill="#38bdf8">
    <circle cx="120" cy="80" r="1.5" style="animation: starPulse 2.5s infinite;" />
    <circle cx="280" cy="140" r="1" style="animation: starPulse 3.5s infinite 1s;" />
    <circle cx="450" cy="70" r="1.8" style="animation: starPulse 4s infinite 0.5s;" />
    <circle cx="620" cy="110" r="1.2" style="animation: starPulse 3s infinite 1.8s;" />
    <circle cx="890" cy="60" r="1.5" style="animation: starPulse 2.8s infinite 0.3s;" />
    <circle cx="530" cy="230" r="1.4" style="animation: starPulse 3.2s infinite 1.2s;" />
  </g>

  <!-- HUD Corner Markers -->
  <g stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 24 50 L 24 24 L 50 24" />
    <path d="M 926 50 L 926 24 L 900 24" />
    <path d="M 24 300 L 24 326 L 50 326" />
    <path d="M 926 300 L 926 326 L 900 326" />
  </g>

  <!-- Terminal Window Controls & Context -->
  <g transform="translate(50, 42)">
    <circle cx="0" cy="0" r="5.5" fill="#ef4444" />
    <circle cx="18" cy="0" r="5.5" fill="#eab308" />
    <circle cx="36" cy="0" r="5.5" fill="#10b981" />
    <text x="60" y="4" class="font-mono" font-size="12" font-weight="600" fill="#64748b">
      lxlnimalxl@nexus-3d <tspan fill="#00f2fe">~/hologram</tspan> <tspan fill="#a855f7">(v3.8-gold)</tspan>
    </text>
  </g>

  <!-- Live Status Capsule (Top Right) -->
  <g transform="translate(680, 28)">
    <rect width="220" height="34" rx="17" fill="#071322" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#specularGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" class="font-mono" font-size="11.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">OPEN FOR COLLABORATION</text>
  </g>

  <!-- Hero Name Typography -->
  <g transform="translate(50, 140)">
    <text class="font-sans" font-size="48" font-weight="900" fill="url(#neonTitle)" letter-spacing="-0.5" filter="url(#specularGlow)">
      SEYED NIMA ROUNAGHI
    </text>
  </g>

  <!-- Subtitle Tagline with 3D Cyber Glyphs -->
  <g transform="translate(50, 186)">
    <text class="font-mono" font-size="16.5" font-weight="600" fill="#94a3b8" letter-spacing="0.3">
      <tspan fill="#38bdf8">âš¡ Frontend Architect</tspan>
      <tspan fill="#475569"> â€¢ </tspan>
      <tspan fill="#c084fc">ðŸŽ¨ UI/UX Technologist</tspan>
      <tspan fill="#475569"> â€¢ </tspan>
      <tspan fill="#34d399">âš™ï¸ Systems Engineer</tspan>
    </text>
  </g>

  <!-- Interactive 3D Focus Pills (Bottom) -->
  <g transform="translate(50, 240)">
    <!-- Pill 1 -->
    <g class="pill-anim1" transform="translate(0, 0)">
      <rect width="180" height="40" rx="20" fill="#0b1324" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="90" y="25" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#38bdf8">âš¡ REACT 19 &amp; TYPESCRIPT</text>
    </g>

    <!-- Pill 2 -->
    <g class="pill-anim2" transform="translate(195, 0)">
      <rect width="190" height="40" rx="20" fill="#140f24" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="95" y="25" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#c084fc">ðŸŽ¨ 3D &amp; DESIGN SYSTEMS</text>
    </g>

    <!-- Pill 3 -->
    <g class="pill-anim3" transform="translate(400, 0)">
      <rect width="190" height="40" rx="20" fill="#0a1818" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="95" y="25" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#34d399">âš™ï¸ C++20 &amp; OOP ENGINES</text>
    </g>

    <!-- Pill 4 -->
    <g class="pill-anim4" transform="translate(605, 0)">
      <rect width="210" height="40" rx="20" fill="#1c1404" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.9" />
      <text x="105" y="25" text-anchor="middle" class="font-sans" font-size="12" font-weight="800" fill="url(#goldGradient)">ðŸ† 5x GITHUB GOLD TIERS</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- 3D HOLOGRAPHIC ROTATING GYROSCOPE & CRYSTAL (PURE VECTOR 3D ENGINE) -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 0)">
    <!-- Outer Gyroscope Ring 1 -->
    <ellipse cx="780" cy="175" rx="70" ry="70" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.65" class="gyro-1" />

    <!-- Middle Gyroscope Ring 2 (Skewed Orbit) -->
    <ellipse cx="780" cy="175" rx="85" ry="38" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="14 8" opacity="0.75" class="gyro-2" />

    <!-- Inner Gyroscope Ring 3 (Cross Axis) -->
    <ellipse cx="780" cy="175" rx="55" ry="85" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.6" class="gyro-3" />

    <!-- Central Floating 3D Polyhedral Crystal Core -->
    <g class="crystal-float">
      <!-- Crystal Shadow Projection -->
      <ellipse cx="780" cy="245" rx="35" ry="9" fill="#00f2fe" opacity="0.25" filter="url(#glow3d)">
        <animate attributeName="rx" values="35;26;35" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.25;0.12;0.25" dur="4s" repeatCount="indefinite" />
      </ellipse>

      <!-- 3D Diamond Facet Top Left -->
      <polygon points="780,120 740,175 780,195" fill="url(#crystalFacet1)" class="facet-1" stroke="#00f2fe" stroke-width="1" />

      <!-- 3D Diamond Facet Top Right -->
      <polygon points="780,120 820,175 780,195" fill="url(#crystalFacet2)" class="facet-2" stroke="#a855f7" stroke-width="1" />

      <!-- 3D Diamond Facet Bottom Left -->
      <polygon points="740,175 780,195 780,230" fill="url(#crystalFacet2)" class="facet-2" stroke="#a855f7" stroke-width="1" />

      <!-- 3D Diamond Facet Bottom Right -->
      <polygon points="820,175 780,195 780,230" fill="url(#crystalFacet3)" class="facet-1" stroke="#ec4899" stroke-width="1" />

      <!-- Glowing Vertices Nodes -->
      <circle cx="780" cy="120" r="3.5" fill="#ffffff" filter="url(#specularGlow)" />
      <circle cx="740" cy="175" r="3" fill="#00f2fe" filter="url(#specularGlow)" />
      <circle cx="820" cy="175" r="3" fill="#ec4899" filter="url(#specularGlow)" />
      <circle cx="780" cy="195" r="4" fill="#ffffff" filter="url(#specularGlow)" />
      <circle cx="780" cy="230" r="3" fill="#a855f7" filter="url(#specularGlow)" />
    </g>
  </g>
</svg>
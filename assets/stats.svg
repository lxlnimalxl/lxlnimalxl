    <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 16 L 0 16 Z" fill="url(#greenLine)" />
    <text x="18" y="48" class="font-mono" font-size="11.5" font-weight="700" fill="#94a3b8">STACK ARCHITECTURE</text>
    <text x="18" y="92" class="font-sans" font-size="34" font-weight="900" fill="#34d399">FULL-STACK</text>
    <text x="18" y="118" class="font-mono" font-size="10.5" fill="#64748b">React â€¢ C++20 â€¢ UI/UX</text>

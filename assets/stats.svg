    <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 16 L 0 16 Z" fill="url(#goldLine)" />
    <text x="18" y="48" class="font-mono" font-size="11.5" font-weight="700" fill="#94a3b8">GOLD BADGES EARNED</text>
    <text x="18" y="92" class="font-sans" font-size="36" font-weight="900" fill="#fbbf24">5/5</text>
    <text x="18" y="118" class="font-mono" font-size="10.5" fill="#64748b">Max Tiers (128x, 48x, 32x)</text>
  </g>

  <!-- Metric 4: System Architecture -->

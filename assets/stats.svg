<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 150" width="100%" height="100%">
  <defs>
    <linearGradient id="metricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="topCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="topPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="topGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="topGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <rect width="950" height="150" rx="16" fill="#04060b" stroke="#1e293b" stroke-width="1.3" />

  <!-- CARD 1: 28+ Repositories (X = 25) -->
  <g transform="translate(25, 18)">
    <animateTransform attributeName="transform" type="translate" values="25,18; 25,14; 25,18" dur="3.5s" repeatCount="indefinite" />
    <rect width="210" height="114" rx="12" fill="url(#metricBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 15 L 0 15 Z" fill="url(#topCyan)" />
    <text x="18" y="44" class="font-mono" font-size="11.5" font-weight="800" fill="#94a3b8">CODE REPOSITORIES</text>
    <text x="18" y="86" class="font-sans" font-size="34" font-weight="900" fill="#00f2fe">28+</text>
    <text x="18" y="108" class="font-mono" font-size="10.5" fill="#64748b">Verified Codebases</text>
  </g>

  <!-- CARD 2: 135+ Merged PRs (X = 255) -->
  <g transform="translate(255, 18)">
    <animateTransform attributeName="transform" type="translate" values="255,18; 255,14; 255,18" dur="3.8s" repeatCount="indefinite" />
    <rect width="210" height="114" rx="12" fill="url(#metricBg)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 15 L 0 15 Z" fill="url(#topPurple)" />
    <text x="18" y="44" class="font-mono" font-size="11.5" font-weight="800" fill="#94a3b8">MERGED PULL REQUESTS</text>
    <text x="18" y="86" class="font-sans" font-size="34" font-weight="900" fill="#c084fc">135+</text>
    <text x="18" y="108" class="font-mono" font-size="10.5" fill="#64748b">Continuous Merge Cadence</text>
  </g>

  <!-- CARD 3: 5/5 Gold Badges (X = 485) -->
  <g transform="translate(485, 18)">
    <animateTransform attributeName="transform" type="translate" values="485,18; 485,14; 485,18" dur="3.6s" repeatCount="indefinite" />
    <rect width="210" height="114" rx="12" fill="url(#metricBg)" stroke="#fbbf24" stroke-width="1.3" stroke-opacity="0.5" />
    <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 15 L 0 15 Z" fill="url(#topGold)" />
    <text x="18" y="44" class="font-mono" font-size="11.5" font-weight="800" fill="#94a3b8">GOLD BADGES EARNED</text>
    <text x="18" y="86" class="font-sans" font-size="34" font-weight="900" fill="#fbbf24">5 / 5</text>
    <text x="18" y="108" class="font-mono" font-size="10.5" fill="#64748b">Max Tiers (128x, 48x, 32x)</text>
  </g>

  <!-- CARD 4: Full Stack Architecture (X = 715) -->
  <g transform="translate(715, 18)">
    <animateTransform attributeName="transform" type="translate" values="715,18; 715,14; 715,18" dur="4s" repeatCount="indefinite" />
    <rect width="210" height="114" rx="12" fill="url(#metricBg)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
    <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 15 L 0 15 Z" fill="url(#topGreen)" />
    <text x="18" y="44" class="font-mono" font-size="11.5" font-weight="800" fill="#94a3b8">SYSTEM SPECTRUM</text>
    <text x="18" y="86" class="font-sans" font-size="30" font-weight="900" fill="#34d399">FULL-STACK</text>
    <text x="18" y="108" class="font-mono" font-size="10.5" fill="#64748b">React • C++20 • UI/UX</text>
  </g>
</svg>